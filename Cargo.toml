[workspace]
members = ["crates/adv360-core", "crates/adv360-tui", "crates/adv360-gui", "crates/adv360-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Josue Chavarria"]
license = "MIT"
# The license text is in LICENSE at the repository root.
#
# `repository` is deliberately absent rather than set to a placeholder: paste your own URL here
# once the repository exists, for example
#     repository = "https://github.com/<you>/advantage360-manager"
description = "Configure a Kinesis Advantage360 SmartSet USB keyboard (GTK4 GUI + Ratatui TUI over one shared core)"

[workspace.dependencies]
adv360-core = { path = "crates/adv360-core", version = "0.1.0" }
adv360-tui = { path = "crates/adv360-tui", version = "0.1.0" }
adv360-gui = { path = "crates/adv360-gui", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "crossterm_0_29",
    "all-widgets",
    "layout-cache",
    "macros",
    "underline-color",
] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
gtk4 = { version = "0.11", default-features = false, features = ["v4_10"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
