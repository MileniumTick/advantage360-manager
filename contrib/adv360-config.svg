<?xml version="1.0" encoding="UTF-8"?>
<!--
  adv360-config icon.

  Concept: the two halves of the Advantage360 with their tilted keywells, and the six RGB
  indicator LEDs the keyboard actually has, three above each thumb cluster. The plate is slate so
  the mark survives on both light and dark panels; the LED column carries the only accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="Advantage360 SmartSet manager">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31363d"/>
      <stop offset="1" stop-color="#20242a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#plate)"/>

  <!-- Left keywell: a tilted block of keys, mirroring the real module. -->
  <g fill="#e9ecef">
    <g transform="translate(20 34) rotate(-6)">
      <rect x="0"  y="0"  width="12" height="11" rx="2.5"/>
      <rect x="14" y="0"  width="12" height="11" rx="2.5"/>
      <rect x="28" y="0"  width="12" height="11" rx="2.5"/>
      <rect x="4"  y="13" width="12" height="11" rx="2.5"/>
      <rect x="18" y="13" width="12" height="11" rx="2.5"/>
      <rect x="32" y="13" width="12" height="11" rx="2.5"/>
      <rect x="8"  y="26" width="12" height="11" rx="2.5"/>
      <rect x="22" y="26" width="12" height="11" rx="2.5"/>
    </g>

    <!-- Right keywell, mirrored. -->
    <g transform="translate(70 34) rotate(6)">
      <rect x="0"  y="0"  width="12" height="11" rx="2.5"/>
      <rect x="14" y="0"  width="12" height="11" rx="2.5"/>
      <rect x="28" y="0"  width="12" height="11" rx="2.5"/>
      <rect x="4"  y="13" width="12" height="11" rx="2.5"/>
      <rect x="18" y="13" width="12" height="11" rx="2.5"/>
      <rect x="32" y="13" width="12" height="11" rx="2.5"/>
      <rect x="8"  y="26" width="12" height="11" rx="2.5"/>
      <rect x="22" y="26" width="12" height="11" rx="2.5"/>
    </g>
  </g>

  <!-- Thumb clusters: two tall keys, one per half. -->
  <g fill="#e9ecef" opacity="0.75">
    <rect x="40" y="82" width="10" height="20" rx="4" transform="rotate(-6 45 92)"/>
    <rect x="78" y="82" width="10" height="20" rx="4" transform="rotate(6 83 92)"/>
  </g>

  <!-- The six indicator LEDs, three above each thumb cluster. -->
  <g fill="#ffb454">
    <circle cx="20" cy="20" r="4"/>
    <circle cx="34" cy="20" r="4"/>
    <circle cx="48" cy="20" r="4"/>
    <circle cx="80" cy="20" r="4"/>
    <circle cx="94" cy="20" r="4"/>
    <circle cx="108" cy="20" r="4"/>
  </g>
</svg>
